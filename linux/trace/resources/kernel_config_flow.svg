<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="acg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0bec5"/>
    </marker>
    <marker id="acv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="630" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" font-weight="600" fill="#263238">Config files &#8594; resolved <tspan font-family="Consolas, monospace">.config</tspan> &#8594; build output</text>
  <text x="24" y="46" font-size="10.5" fill="#78909c">QCM4490 (parrot) &#8212; two independent config chains, only the lower one is yours</text>

  <!-- ===================== lane 1 : GKI ===================== -->
  <rect x="24" y="62" width="912" height="152" rx="8" fill="#fafafa" stroke="#e0e0e0" stroke-width="1.2"/>
  <text x="40" y="84" font-size="11.5" font-weight="600" fill="#90a4ae">GKI KERNEL IMAGE &#8212; informational only</text>

  <rect x="40" y="96" width="250" height="60" rx="6" fill="#ffffff" stroke="#b0bec5" stroke-width="1.2"/>
  <text x="52" y="116" font-size="10" fill="#78909c" font-family="Consolas, monospace">common/arch/arm64/configs/</text>
  <text x="52" y="133" font-size="11.5" font-weight="600" fill="#37474f" font-family="Consolas, monospace">gki_defconfig</text>
  <text x="52" y="148" font-size="9.5" fill="#c62828">&#10007; no changes allowed</text>

  <line x1="290" y1="126" x2="366" y2="126" stroke="#b0bec5" stroke-width="1.6" marker-end="url(#acg)"/>
  <text x="328" y="118" font-size="9.5" fill="#90a4ae" text-anchor="middle">+ Kconfig</text>

  <rect x="372" y="96" width="264" height="60" rx="6" fill="#ffffff" stroke="#b0bec5" stroke-width="1.2"/>
  <text x="384" y="116" font-size="10" fill="#78909c" font-family="Consolas, monospace">out/msm-waipio-parrot-gki/</text>
  <text x="384" y="133" font-size="11.5" font-weight="600" fill="#37474f" font-family="Consolas, monospace">gki_kernel/common/.config</text>
  <text x="384" y="148" font-size="9.5" fill="#90a4ae">full GKI config</text>

  <line x1="636" y1="126" x2="700" y2="126" stroke="#b0bec5" stroke-width="1.6" marker-end="url(#acg)"/>

  <rect x="706" y="96" width="214" height="60" rx="6" fill="#eceff1" stroke="#b0bec5" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="718" y="117" font-size="11" font-weight="600" fill="#546e7a">kernel <tspan font-family="Consolas, monospace">Image</tspan> &#8594; boot.img</text>
  <text x="718" y="135" font-size="9.5" fill="#b0480f">discarded &#8212; Google GKI</text>
  <text x="718" y="149" font-size="9.5" fill="#b0480f">boot.img is flashed instead</text>

  <text x="40" y="185" font-size="10.5" fill="#78909c">With <tspan font-family="Consolas, monospace" fill="#546e7a">DL_USE_PREBUILT_GKI=true</tspan> (default) the built <tspan font-family="Consolas, monospace">boot.img</tspan> is thrown away, so every <tspan font-family="Consolas, monospace">=y</tspan> built-in change here is invisible on the device.</text>
  <text x="40" y="202" font-size="10.5" fill="#78909c"><tspan font-family="Consolas, monospace">msm-kernel/.../gki_defconfig</tspan> is byte-identical to <tspan font-family="Consolas, monospace">common/.../gki_defconfig</tspan> and is equally off-limits.</text>

  <!-- ===================== lane 2 : vendor ===================== -->
  <rect x="24" y="230" width="912" height="252" rx="8" fill="#f7fbf7" stroke="#c8e6c9" stroke-width="1.2"/>
  <text x="40" y="252" font-size="11.5" font-weight="600" fill="#2e7d32">VENDOR MODULES + DEVICE TREE &#8212; what you actually build</text>

  <rect x="40" y="264" width="250" height="60" rx="6" fill="#ffffff" stroke="#b0bec5" stroke-width="1.2"/>
  <text x="52" y="284" font-size="10" fill="#78909c" font-family="Consolas, monospace">msm-kernel/arch/arm64/configs/</text>
  <text x="52" y="301" font-size="11.5" font-weight="600" fill="#37474f" font-family="Consolas, monospace">gki_defconfig</text>
  <text x="52" y="316" font-size="9.5" fill="#c62828">&#10007; base &#8212; no changes allowed</text>

  <rect x="40" y="344" width="250" height="64" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.8"/>
  <text x="52" y="364" font-size="10" fill="#78909c" font-family="Consolas, monospace">msm-kernel/arch/arm64/configs/vendor/</text>
  <text x="52" y="381" font-size="11.5" font-weight="600" fill="#2e7d32" font-family="Consolas, monospace">parrot_GKI.config</text>
  <text x="52" y="398" font-size="9.5" font-weight="600" fill="#2e7d32">&#10003; vendor fragment &#8212; edit here</text>

  <path d="M290 294 L316 294 L316 330" fill="none" stroke="#2e7d32" stroke-width="1.6"/>
  <path d="M290 376 L316 376 L316 356" fill="none" stroke="#2e7d32" stroke-width="1.6"/>
  <rect x="300" y="330" width="52" height="30" rx="15" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="326" y="350" font-size="10.5" font-weight="600" fill="#2e7d32" text-anchor="middle">merge</text>

  <line x1="352" y1="345" x2="378" y2="345" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#acv)"/>

  <rect x="384" y="314" width="252" height="62" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.8"/>
  <text x="396" y="334" font-size="10" fill="#78909c" font-family="Consolas, monospace">out/msm-waipio-parrot-gki/</text>
  <text x="396" y="351" font-size="11.5" font-weight="600" fill="#2e7d32" font-family="Consolas, monospace">msm-kernel/.config</text>
  <text x="396" y="367" font-size="9.5" fill="#2e7d32">the resolved config that matters</text>

  <path d="M636 345 L668 345 L668 288 L700 288" fill="none" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#acv)"/>
  <path d="M636 345 L668 345 L700 345" fill="none" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#acv)"/>
  <path d="M636 345 L668 345 L668 402 L700 402" fill="none" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#acv)"/>

  <rect x="706" y="266" width="214" height="44" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.2"/>
  <text x="718" y="285" font-size="11" font-weight="600" fill="#2e7d32">modules <tspan font-family="Consolas, monospace">=m</tspan> &#8594; <tspan font-family="Consolas, monospace">.ko</tspan></text>
  <text x="718" y="301" font-size="9.5" fill="#388e3c">vendor_boot.img / vendor_dlkm.img</text>

  <rect x="706" y="323" width="214" height="44" rx="6" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.2"/>
  <text x="718" y="342" font-size="11" font-weight="600" fill="#1565c0">device tree &#8594; <tspan font-family="Consolas, monospace">.dtb</tspan></text>
  <text x="718" y="358" font-size="9.5" fill="#1976d2">vendor_boot.img</text>

  <rect x="706" y="380" width="214" height="44" rx="6" fill="#fff8e1" stroke="#ffb74d" stroke-width="1.2"/>
  <text x="718" y="399" font-size="11" font-weight="600" fill="#e65100">overlays &#8594; <tspan font-family="Consolas, monospace">.dtbo</tspan></text>
  <text x="718" y="415" font-size="9.5" fill="#ef6c00">dtbo.img</text>

  <text x="40" y="440" font-size="10.5" fill="#546e7a">The fragment can only <tspan font-weight="600">add</tspan> symbols the base leaves unset. Redefining or overriding anything already set in <tspan font-family="Consolas, monospace">gki_defconfig</tspan> breaks the build.</text>
  <text x="40" y="458" font-size="10.5" fill="#546e7a">Whether a module lands in <tspan font-family="Consolas, monospace">vendor_boot</tspan> or <tspan font-family="Consolas, monospace">vendor_dlkm</tspan> is decided by <tspan font-family="Consolas, monospace">modules.list.msm.parrot</tspan>, not by the config.</text>

  <!-- ===================== verify band ===================== -->
  <rect x="24" y="498" width="912" height="108" rx="8" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="40" y="520" font-size="12" font-weight="600" fill="#37474f">Where to verify</text>
  <text x="40" y="544" font-size="10.5" fill="#546e7a">host, modules &amp; DT &#8212; <tspan font-family="Consolas, monospace" fill="#2e7d32">grep CONFIG_FOO out/msm-waipio-parrot-gki/msm-kernel/.config</tspan></text>
  <text x="40" y="564" font-size="10.5" fill="#546e7a">device, running kernel &#8212; <tspan font-family="Consolas, monospace" fill="#37474f">adb shell zcat /proc/config.gz</tspan>  (this is the <tspan font-weight="600">GKI</tspan> config, not the vendor fragment)</text>
  <text x="40" y="584" font-size="10.5" fill="#546e7a">device, loaded modules &#8212; <tspan font-family="Consolas, monospace" fill="#37474f">adb shell cat /proc/modules</tspan>  /  <tspan font-family="Consolas, monospace" fill="#37474f">adb shell lsmod</tspan></text>
</svg>
